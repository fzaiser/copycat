name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Typst ${{ matrix.typst }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        typst: [floor, latest]
    steps:
      - uses: actions/checkout@v7
      # "floor" is the manifest's compiler floor, read from typst.toml so the
      # two cannot drift; "latest" is whatever release users currently install.
      - id: version
        run: |
          if [ "${{ matrix.typst }}" = floor ]; then
            echo "typst=$(sed -n 's/^compiler = "\(.*\)"/\1/p' typst.toml)" >> "$GITHUB_OUTPUT"
          else
            echo "typst=latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.version.outputs.typst }}
      - name: Install typst-package-check
        # Pinned so upstream lint changes cannot break CI at a random moment;
        # bump the rev deliberately.
        run: cargo install --git https://github.com/typst/package-check --rev 50eb19311fde --locked
      - name: Run the test suite
        run: scripts/test.sh

  docs:
    name: Rendered docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The figures and the gallery are compared under the release that
      # rendered them, whichever that is.
      - id: renderer
        run: echo "typst=$(cat docs/typst-version)" >> "$GITHUB_OUTPUT"
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.renderer.outputs.typst }}
      - run: scripts/render-docs.sh --check

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.49.0
