[package]
name = "copycat"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["Fabian Zaiser <fzaiser@mit.edu>"]
license = "MIT"
description = "Draw string diagrams for Markov and copy-discard categories."
repository = "https://github.com/fzaiser/copycat"
keywords = ["string diagram", "Markov category", "CD category", "copy-discard", "monoidal category", "category theory", "probability", "cetz"]
categories = ["visualization"]
disciplines = ["mathematics", "computer-science"]
# The floor of cetz 0.5.2, which copycat imports.
compiler = "0.14.0"
# docs/ is submitted to typst/packages, so that the README can link to it, but is
# left out of the bundle that typst downloads. The other entries are development
# files; scripts/stage.sh assembles the submission without them.
exclude = ["/docs", "/tests", "/scripts", "/.github", "/CONTRIBUTING.md", "/PUBLISHING.md", "/.typos.toml"]
